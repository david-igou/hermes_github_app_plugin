[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "hermes-github-app-plugin"
version = "0.3.0"
description = "Runtime-minted, repo-scoped GitHub App tokens: credential helper, gh/git wrappers, unix-socket broker, and Hermes agent tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hermes GitHub App Plugin Contributors" }]
dependencies = [
  "httpx>=0.28.1",
  "PyJWT[crypto]>=2.13.0",
  "PyYAML>=6.0.3",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.5",
  "types-PyYAML>=6.0.12.20260815",
]

[project.entry-points."hermes_agent.plugins"]
github-app = "hermes_github_app_plugin"

[project.scripts]
ghapp = "hermes_github_app_plugin.cli:main"
gh-app = "hermes_github_app_plugin.cli:gh_app_main"
git-app = "hermes_github_app_plugin.cli:git_app_main"
git-credential-ghapp = "hermes_github_app_plugin.cli:git_credential_main"
hermes-github-app = "hermes_github_app_plugin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_github_app_plugin"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.yaml" = "hermes_github_app_plugin/plugin.yaml"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["hermes_github_app_plugin"]

[tool.pytest.ini_options]
addopts = "--cov=hermes_github_app_plugin --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
