version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # One grouped PR for all actions: github/codeql-action init+analyze+
    # upload-sarif must move in lockstep (CodeQL hard-fails on mixed
    # versions, so partial bumps can never go green).
    groups:
      github-actions:
        patterns: ["*"]
